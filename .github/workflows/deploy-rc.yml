name: Deploy Portal+ RC

on:
  workflow_dispatch:
    inputs:
      site:
        description: Atlassian site
        required: true
        default: nuvriqo.atlassian.net
      environment:
        description: Forge environment
        required: true
        type: choice
        options: [development, staging, production]
        default: development
      install_mode:
        description: Installation action after deploy
        required: true
        type: choice
        options: [upgrade, install]
        default: upgrade
  push:
    branches:
      - release/portal-plus-v1-rc
    paths:
      - .deploy/portal-plus-rc

permissions:
  contents: read

concurrency:
  group: portal-plus-rc-deploy
  cancel-in-progress: false

env:
  DEPLOY_SITE: ${{ github.event.inputs.site || 'nuvriqo.atlassian.net' }}
  DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || 'development' }}
  DEPLOY_INSTALL_MODE: ${{ github.event.inputs.install_mode || 'upgrade' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nuvriqo-sandbox
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL secret" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN secret" && exit 1)
          test -f manifest.yml || (echo "manifest.yml not found" && exit 1)
          grep -q '^  id: ari:cloud:ecosystem::app/f6485514-56d4-419c-8bc7-cd097d0076d0$' manifest.yml || (echo "Unexpected Portal+ Forge app ID" && exit 1)
          test "$DEPLOY_SITE" = "nuvriqo.atlassian.net" || (echo "Unexpected deployment site" && exit 1)
          test "$DEPLOY_ENVIRONMENT" = "development" || (echo "Push-triggered deploys are limited to development" && exit 1)

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build and release checks
        run: npm test

      - name: Install Forge CLI
        run: |
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment "$DEPLOY_ENVIRONMENT"

      - name: Forge lint
        run: forge lint

      - name: Deploy release candidate
        run: forge deploy --environment "$DEPLOY_ENVIRONMENT" --non-interactive

      - name: Apply installation
        shell: bash
        run: |
          if [ "$DEPLOY_INSTALL_MODE" = "upgrade" ]; then
            forge install --upgrade --site "$DEPLOY_SITE" --product jira --environment "$DEPLOY_ENVIRONMENT" --confirm-scopes --non-interactive
          else
            forge install --site "$DEPLOY_SITE" --product jira --environment "$DEPLOY_ENVIRONMENT" --confirm-scopes --non-interactive
          fi

      - name: Deployment summary
        run: |
          echo "Portal+ RC deployed"
          echo "Site: $DEPLOY_SITE"
          echo "Environment: $DEPLOY_ENVIRONMENT"
          echo "Install mode: $DEPLOY_INSTALL_MODE"
