name: Portal+ CI

on:
  push:
    branches: [main, foundation/v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build and static release checks
        run: npm test

      - name: Production dependency vulnerability check
        run: npm audit --omit=dev --audit-level=high
