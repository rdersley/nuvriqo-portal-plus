<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Nuvriqo Portal+</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div><h2>Your service dashboard</h2><p>A clearer view of your support requests.</p></div>
      <span class="badge">V1 Preview</span>
    </div>
    <div class="cards">
      <div class="card"><div class="label">Open requests</div><div class="value" id="open">—</div></div>
      <div class="card"><div class="label">Awaiting you</div><div class="value">—</div></div>
      <div class="card"><div class="label">Awaiting support</div><div class="value">—</div></div>
      <div class="card"><div class="label">Visible requests</div><div class="value" id="total">—</div></div>
    </div>
    <section class="section">
      <h3>Recent requests</h3>
      <div id="requests" class="message">Loading your requests…</div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
