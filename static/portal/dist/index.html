<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuvriqo Portal+</title><link rel="stylesheet" href="./styles.css"></head><body><main class="wrap"><header id="brand-hero" class="brand-hero"><div class="brand-lockup"><span id="brand-mark" class="brand-mark" hidden></span><img id="brand-logo" class="brand-logo" alt="" hidden><div><span id="brand-name" class="brand-name"></span><span id="experience-name" class="experience-label"></span><h2>Your service dashboard</h2><p>A clearer view of your support requests.</p></div></div><div class="top-actions"><button id="supportButton" class="support-button" type="button" hidden>Support</button><button id="exportCsv" class="export-button" type="button">Export CSV</button></div></header><div id="hero-message" class="hero-message" hidden><strong id="hero-title"></strong><span id="hero-text"></span></div><div id="announcements" class="announcements" hidden></div><div class="cards"><button class="card metric-card" id="open-card" type="button" data-view="open"><div class="label">Open requests</div><div class="value" id="open">—</div><span class="card-hint">View open</span></button><button class="card metric-card" id="awaiting-you-card" type="button" data-view="awaiting-you"><div class="label">Awaiting you</div><div class="value" id="awaiting-you">—</div><span class="card-hint">Needs your attention</span></button><button class="card metric-card" id="awaiting-support-card" type="button" data-view="awaiting-support"><div class="label">Awaiting support</div><div class="value" id="awaiting-support">—</div><span class="card-hint">With the support team</span></button><button class="card metric-card" id="total-card" type="button" data-view="all"><div class="label">Visible requests</div><div class="value" id="total">—</div><span class="card-hint">View all</span></button></div><div id="export-message" class="export-message" hidden></div><section id="action-centre-section" class="section action-centre" hidden><div class="section-head"><div><h3>Things needing your attention</h3><p>Requests currently waiting for you, prioritised by age.</p></div><span id="action-count" class="result-count"></span></div><div id="action-centre" class="action-list"></div></section><section id="quick-actions-section" class="section" hidden><h3>Services & Quick Actions</h3><div id="quick-actions" class="category-grid"></div></section><section id="links-section" class="section" hidden><h3>Useful resources</h3><div id="useful-links" class="link-grid"></div></section><section class="section recent-section"><div class="section-head request-title-row"><div><h3>Your requests</h3><p id="active-view-label" class="active-view-label">All visible requests</p></div><span id="result-count" class="result-count"></span></div><div id="saved-views" class="saved-views"><button type="button" class="view-chip active" data-preset="all">All</button><button type="button" class="view-chip" data-preset="open">Open</button><button type="button" class="view-chip" data-preset="awaiting-you">Waiting for me</button><button type="button" class="view-chip" data-preset="awaiting-support">Waiting for support</button><span id="custom-views" class="custom-views"></span><button id="save-view" type="button" class="view-chip save-view">+ Save current view</button><select id="density" class="density-select" aria-label="Request list density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></div><div id="request-tools" class="request-tools" hidden><input id="request-search" type="search" placeholder="Search key or summary"><select id="request-status"><option value="">All statuses</option></select><select id="request-type"><option value="">All request types</option></select><select id="request-date"><option value="">Any date</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days<
