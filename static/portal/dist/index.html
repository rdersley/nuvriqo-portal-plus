<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nuvriqo Portal+</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b4d}*{box-sizing:border-box}body{margin:0;background:#fff}.wrap{padding:8px 4px 12px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.top h2{font-size:18px;line-height:24px;margin:0}.top p{font-size:12px;margin:2px 0 0;color:#626f86}.badge{font-size:11px;background:#e9f2ff;color:#0c66e4;border-radius:10px;padding:4px 8px;font-weight:700;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}.card{border:1px solid #dcdfe4;border-radius:8px;padding:10px;min-height:68px}.label{font-size:11px;color:#626f86;font-weight:600}.value{font-size:22px;font-weight:700;line-height:28px;margin-top:2px}.section{border-top:1px solid #ebecf0;padding-top:10px}.section h3{font-size:13px;margin:0 0 7px}.requests{display:grid;gap:5px}.request{display:grid;grid-template-columns:90px 1fr 135px;gap:8px;align-items:center;border:1px solid #ebecf0;border-radius:6px;padding:7px 9px;font-size:12px}.key{font-weight:700;color:#0c66e4}.summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;font-weight:600;background:#f1f2f4;border-radius:10px;padding:3px 7px;text-align:center}.loading,.error{font-size:12px;padding:10px;border:1px dashed #b3b9c4;border-radius:6px;color:#626f86}.error{color:#ae2e24;background:#fff7f5}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.request{grid-template-columns:75px 1fr}.status{grid-column:2;text-align:left;width:max-content}}</style></head><body><main class="wrap"><div class="top"><div><h2>Your service dashboard</h2><p>A clearer view of your support requests.</p></div><span class="badge">V1 Preview</span></div><div class="cards"><div class="card"><div class="label">Open requests</div><div class="value" id="open">—</div></div><div class="card"><div class="label">Awaiting you</div><div class="value">—</div></div><div class="card"><div class="label">Awaiting support</div><div class="value">—</div></div><div class="card"><div class="label">Visible requests</div><div class="value" id="total">—</div></div></div><section class="section"><h3>Recent requests</h3><div id="requests" class="loading">Loading your requests…</div></section></main><script type="module">import { invoke, view } from 'https://esm.sh/@forge/bridge@5';
const box=document.getElementById('requests');
const safe=v=>v==null?'':String(v);
const esc=v=>safe(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const summary=r=>safe(r.requestFieldValues?.find?.(f=>f.fieldId==='summary')?.value||r.summary||r.requestType?.name||'Service request');
const status=r=>safe(r.currentStatus?.status||r.status?.name||'Open');
const closed=r=>['closed','resolved','done','cancelled','canceled'].some(x=>status(r).toLowerCase().includes(x));
async function load(){try{const data=await invoke('getMyRequests');const values=Array.isArray(data?.values)?data.values:[];document.getElementById('total').textContent=data?.size??values.length;document.getElementById('open').textContent=values.filter(r=>!closed(r)).length;if(!values.length){box.textContent='No requests are currently visible to this account.';return}box.className='requests';box.innerHTML=values.slice(0,4).map(r=>`<div class="request"><div class="key">${esc(r.issueKey||r.key)}</div><div class="summary">${esc(summary(r))}</div><div class="status">${esc(status(r))}</div></div>`).join('')}catch(e){box.className='error';box.textContent='Could not load request data: '+(e?.message||String(e))}finally{try{await view.resize()}catch(_){}}}
load();</script></body></html>
