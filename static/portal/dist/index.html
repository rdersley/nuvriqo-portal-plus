<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nuvriqo Portal+</title>
<script src="https://connect-cdn.atl-paas.net/all.js" async></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b4d}*{box-sizing:border-box}body{margin:0;background:#fff}.wrap{max-width:1180px;margin:0 auto;padding:12px 8px 28px}.eyebrow{font-size:12px;font-weight:700;color:#44546f;text-transform:uppercase;letter-spacing:.06em}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin:6px 0 18px}.top h2{font-size:24px;margin:0 0 4px}.top p{margin:0;color:#626f86}.badge{font-size:12px;background:#e9f2ff;color:#0c66e4;border-radius:12px;padding:5px 9px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 20px}.card{border:1px solid #dcdfe4;border-radius:10px;padding:14px;background:#fff;min-height:92px}.card .label{font-size:13px;color:#626f86;font-weight:600}.card .value{font-size:28px;font-weight:700;margin-top:7px}.card .hint{font-size:12px;color:#7a869a;margin-top:2px}.section{border-top:1px solid #ebecf0;padding-top:16px}.section h3{font-size:16px;margin:0 0 10px}.requests{display:grid;gap:8px}.request{display:grid;grid-template-columns:110px 1fr 160px;gap:12px;align-items:center;border:1px solid #ebecf0;border-radius:8px;padding:10px 12px}.key{font-weight:700;color:#0c66e4}.summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:12px;font-weight:700;background:#f1f2f4;border-radius:12px;padding:5px 9px;text-align:center}.loading,.error{padding:18px;border:1px dashed #b3b9c4;border-radius:8px;color:#626f86}.error{color:#ae2e24;background:#fff7f5}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.request{grid-template-columns:90px 1fr}.status{grid-column:2;text-align:left;width:max-content}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.top{display:block}.badge{display:inline-block;margin-top:8px}}
</style>
</head>
<body><main class="wrap">
<div class="eyebrow">Portal+</div><div class="top"><div><h2>Your service dashboard</h2><p>A clearer view of your support requests.</p></div><span class="badge">V1 Preview</span></div>
<div class="cards"><div class="card"><div class="label">Open requests</div><div class="value" id="open">—</div><div class="hint">Currently active</div></div><div class="card"><div class="label">Awaiting you</div><div class="value" id="awaiting-you">—</div><div class="hint">Status mapping coming next</div></div><div class="card"><div class="label">Awaiting support</div><div class="value" id="awaiting-support">—</div><div class="hint">Status mapping coming next</div></div><div class="card"><div class="label">Visible requests</div><div class="value" id="total">—</div><div class="hint">Available to your account</div></div></div>
<section class="section"><h3>Recent requests</h3><div id="requests" class="loading">Loading your requests…</div></section>
</main>
<script>
const invokeResolver=async(name,payload={})=>{if(!window.AP||!AP.requestJira){throw new Error('Forge bridge is still loading. Refresh the page in a moment.')}return AP.requestJira(name,payload)};
function text(v){return v==null?'':String(v)}
function requestSummary(r){return text(r.requestFieldValues?.find?.(f=>f.fieldId==='summary')?.value||r.summary||r.requestType?.name||'Service request')}
function requestStatus(r){return text(r.currentStatus?.status||r.status?.name||'Open')}
function isClosed(r){const s=requestStatus(r).toLowerCase();return ['closed','resolved','done','cancelled','canceled'].some(x=>s.includes(x))}
async function load(){const box=document.getElementById('requests');try{const data=await invokeResolver('getMyRequests');const values=Array.isArray(data?.values)?data.values:[];document.getElementById('total').textContent=data?.size??values.length;document.getElementById('open').textContent=values.filter(r=>!isClosed(r)).length;document.getElementById('awaiting-you').textContent='—';document.getElementById('awaiting-support').textContent='—';if(!values.length){box.className='loading';box.textContent='No requests are currently visible to this account.';return}box.className='requests';box.innerHTML=values.slice(0,5).map(r=>`<div class="request"><div class="key">${text(r.issueKey||r.key)}</div><div class="summary">${requestSummary(r)}</div><div class="status">${requestStatus(r)}</div></div>`).join('')}catch(e){box.className='error';box.textContent='Portal+ could not load request data yet: '+e.message}}
window.addEventListener('load',()=>setTimeout(load,600));
</script></body></html>
