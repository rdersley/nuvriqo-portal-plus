<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Nuvriqo Portal+</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div><h2>Your service dashboard</h2><p>A clearer view of your support requests.</p></div>
      <div class="top-actions"><button id="exportCsv" class="export-button" type="button">Export CSV</button></div>
    </div>
    <div class="cards">
      <div class="card"><div class="label">Open requests</div><div class="value" id="open">—</div></div>
      <div class="card"><div class="label">Awaiting you</div><div class="value" id="awaiting-you">—</div></div>
      <div class="card"><div class="label">Awaiting support</div><div class="value" id="awaiting-support">—</div></div>
      <div class="card"><div class="label">Visible requests</div><div class="value" id="total">—</div></div>
    </div>
    <div id="export-message" class="export-message" hidden></div>
    <section id="quick-actions-section" class="section quick-actions-section" hidden>
      <h3>Quick actions</h3>
      <div id="quick-actions" class="category-grid"></div>
    </section>
    <section class="section recent-section">
      <div class="section-head"><h3>Requests</h3><span id="result-count" class="result-count"></span></div>
      <div id="request-tools" class="request-tools" hidden>
        <input id="request-search" type="search" placeholder="Search key or summary" aria-label="Search requests">
        <select id="request-status" aria-label="Filter by status"><option value="">All statuses</option></select>
        <select id="request-type" aria-label="Filter by request type"><option value="">All request types</option></select>
        <select id="request-date" aria-label="Filter by date"><option value="">Any date</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last 12 months</option></select>
        <select id="request-sort" aria-label="Sort requests"><option value="recent">Most recent</option><option value="oldest">Oldest</option><option value="key">Key</option></select>
      </div>
      <div id="request-header" class="request-header" hidden></div>
      <div id="requests" class="message">Loading your requests…</div>
      <div id="pagination" class="pagination" hidden>
        <button id="page-prev" class="page-button" type="button">Previous</button>
        <span id="page-info"></span>
        <button id="page-next" class="page-button" type="button">Next</button>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
